title: Todas
tpl:
  bg:
    color: light
  menu:
    logo: true
    logo_align: center
    clear: true
    size: lg
    sticky: auto
    color: alt-dark
    hide_icons: true
  section:
  - size: sm
  sections:
  - file: base-_hero
  - file: base-toc
  - file: base-content
  - file: base-address
  - file: base-author
  - file: base-social
  - file: base-comments
  - file: base-children
  - file: base-share
  - file: base-rel
  list:
    size: lg
    cols: 4
    ratio: 16/9
    inset: true
    align: left
    color: white
    btn: hide
    tags:
    - type: date
    - type: time
  rel:
    slider: true
    arrows: float
  callnow: auto
