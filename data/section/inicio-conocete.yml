name: Inicio ➡️ Conocete
boxes:
- title: CoNóCeTe
  sub: atrévete a indagar dentro de ti
- url: '#test-doshas'
  label: Test Doshas
modal:
  color: white
  inset: true
  line: true
modals:
- id: test-doshas
  title: ¿Sabes cuál es tu Dosha?
  sub: Test
  md: |
    Aquí te dejo un test cuyas respuestas te ayudarán a identificar, no sólo cómo eres, sino por qué eres así

    Antes puede que te interese saber y entender de dónde viene esto:

    [[Ayurbeda Resumen]](/ayurbeda-resumen/)

    Ahora sí, el test:
  align: center
  hanchor: Test Doshas
  form:
    action: https://formsubmit.co/8eedb08a8d9a83b95783e26406aad2c8
  inputs:
  - type: text
    name: Nombre
    req: true
  - type: mail
    name: Email
    req: true
  - type: hidden
    name: _cc
  - type: radio
    name: Textura de la piel
    req: true
    items:
    - label: 1. Seca, áspera, fría, rugosa, venas prominentes
    - label: 2. Caliente, grasosa, húmeda, pecas, acné
    - label: 3. Gruesa, fría, bien lubricada
  - type: radio
    name: Brillo de la piel
    items:
    - label: 1. Mate
    - label: 2. Rojo, ilustroso
    - label: 3. Blanco, pálido
  - type: radio
    name: Temperatura del cuerpo
    items:
    - label: 1. Manos y pies fríos
    - label: 2. Caliente
    - label: 3. Frío o normal
  - type: radio
    name: Peso
    items:
    - label: 1. Dificultad para subir de peso
    - label: 2. Mediano, pueden ganar o perder peso con facilidad
    - label: 3. Generalmente con sobrepeso, dificultad para perderlo
  - type: radio
    name: Contextura
    items:
    - label: 1. Delgado, huesos finos
    - label: 2. Moderada
    - label: 3. Grande, robusto, bien desarrollado
  - type: radio
    name: Estatura
    items:
    - label: 1. Muy alto o muy pequeño
    - label: 2. Mediana
    - label: 3. Generalmente pequeños, pero pueden ser altos y grandes
  - type: radio
    name: Torax
    items:
    - label: 1. Estrecho
    - label: 2. Desarrollado moderado
    - label: 3. Ancho, bien desarrollado
  - type: radio
    name: Pelo
    items:
    - label: 1. Seco, fino, encrespado
    - label: 2. Oleoso, calvicis prematura, canoso
    - label: 3. Fuerte, ondulado, lustroso
  - type: radio
    name: Frente
    items:
    - label: 1. Estrecha
    - label: 2. Moderada, surcos
    - label: 3. Ancha
  - type: radio
    name: Ojos
    items:
    - label: 1. Pequeños, nerviosos
    - label: 2. Penetrantes, se irritan con facilidad
    - label: 3. Grandes, atractivos, pestañas grandes
  - type: radio
    name: Dientes
    items:
    - label: 1. Irregulares, pequeños, mal formados
    - label: 2. Regulares, las encías sangran con facilidad
    - label: 3. Grandes, bien formados
  - type: radio
    name: Lengua
    items:
    - label: 1. Áspera
    - label: 2. Suave, rosada
    - label: 3. Gruesa
  - type: radio
    name: Cara
    items:
    - label: 1. Pequeña, arrugada, seca
    - label: 2. Delicada, rojiza, perfil agudo
    - label: 3. Grande, agradable, perfil suave
  - type: radio
    name: Huesos
    items:
    - label: 1. Delgados, articulaciones crujientes
    - label: 2. Medianos, articulaciones flojas
    - label: 3. Gruesos, articulaciones fuertes
  - type: radio
    name: Uñas
    items:
    - label: 1. Quebradizas, ásperas
    - label: 2. Suaves, rosadas
    - label: 3. Ancha
  - type: radio
    name: Sed
    items:
    - label: 1. Escasa
    - label: 2. Generalmente sediento
    - label: 3. Moderada
  - type: radio
    name: Hábitos intestinales
    items:
    - label: 1. Heces duras, secas, estreñimiento
    - label: 2. Heces suaves, sueltas, tendencia a la diarrea
    - label: 3. Regular, heces normales
  - type: radio
    name: Orina
    items:
    - label: 1. Escasa
    - label: 2. Abundante, amarilla intensa
    - label: 3. Moderada, clara
  - type: radio
    name: Sudorcaión
    items:
    - label: 1. Escasa sin olor
    - label: 2. Profundo olor intenso
    - label: 3. Moderada
  - type: radio
    name: Memoria
    items:
    - label: 1. Rápida, tendencia a olvidar
    - label: 2. Aguda, clara
    - label: 3. Lenta pero constante
  - type: radio
    name: Comprensión
    items:
    - label: 1. Espontánea
    - label: 2. Promedio
    - label: 3. Requiere tiempo para comprender
  - type: radio
    name: Sexualidad
    items:
    - label: 1. Interés sexual variable, fantasía sexual activa
    - label: 2. Interés e impulso sexual alto
    - label: 3. Interés e impulso sexual constante
  - type: radio
    name: Actividad
    items:
    - label: 1. Inquieto, quiere hace mucho a la vez
    - label: 2. Moderado
    - label: 3. Se mueve lentamente
  - type: radio
    name: Temperamento
    items:
    - label: 1. Nervioso, cambiable
    - label: 2. Motivado, intenso
    - label: 3. Conservador
  - type: radio
    name: Estado de ánimo
    items:
    - label: 1. Ideas y estado de ánimo cambiables
    - label: 2. Intenso al expresar ideas y sentimientos
    - label: 3. Estable, confiable, lento para cambiar ideas
  - type: radio
    name: Reacción al estrés
    items:
    - label: 1. Miedo y ansiedad bajo estrés
    - label: 2. Frustración, irritabilidad, enojo abajo estrés
    - label: 3. Lleva bien la presión y el estrés
  - type: radio
    name: Sueño
    items:
    - label: 1. Ligero, con interrupciones
    - label: 2. Variable
    - label: 3. Profundo, excesivo
  - type: radio
    name: Emociones positivas
    items:
    - label: 1. Adaptabilidad
    - label: 2. Valor, coraje
    - label: 3. Amor
  - type: radio
    name: Emociones negativas
    items:
    - label: 1. Miedo
    - label: 2. Cólera
    - label: 3. Apego
  - type: radio
    name: Apetito
    items:
    - label: 1. Variable, nervioso
    - label: 2. Grande, irritable si debe saltar la comida
    - label: 3. Moderado pero constante
  - type: radio
    name: Resistencia a la enfermedad
    items:
    - label: 1. Pobre, sistema inmunológico variable
    - label: 2. Mediana, tendencia a las infecciones
    - label: 3. Buena, consistente, sistema inmunológico fuerte
  - type: radio
    name: Enfermedades frecuentes
    items:
    - label: 1. Alteraciones nerviosas y mentales, dolores neurálgicos y de las articulaciones
    - label: 2. Enfermedades infecciosas e inflamatorias, trastornos sanguíneos
    - label: 3. Enfermedades sistemáticas y respiratorias, edema, mucosidades, inflamación articular
  - type: radio
    name: Le disgusta
    items:
    - label: 1. El frío, la sequedad
    - label: 2. Substancias y atmosfera caliente
    - label: 3. Sustancias frías y aceitosas, atmósfera húmeda
  - type: radio
    name: Preferencias climáticas
    items:
    - label: 1. Climas calientes, sol, humedad
    - label: 2. Climas fríos bien ventilados
    - label: 3. Cualquier clima siempre que no sea húmedo
  - type: radio
    name: Fe
    items:
    - label: 1. Variable, errática
    - label: 2. Fuerte, determinado
    - label: 3. Sostenida, lenta de cambiar
  - type: hidden
    name: Resultado
