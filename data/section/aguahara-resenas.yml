  reviews:
  - title: Cristina Blanco
    img: /u/aguahara/resenas/cristina-blanco.jpg
    md: |
      En mis días previos al periodo, me vino muy bien para soltar y relajar el calor, los movimientos y el agua me ayudaron a conectarme con mi cuerpo y ver el estado el cual se encontraba. Poder soltar y soltar.

      En algunos movimientos Seme aparecía una serpiente recorriendo todo mi cuerpo era una sensación muy sanadora.

      En el momento que me sumergiste estaba flotando, rodeada en una luz brillante era un animal, mi foca nadando km km bajo el mar. Sentía paz mucha paz cada vez quería estar más y más dentro del agua.

      Fue una maravilla de experiencia
  - title: Rosa Nuñez
    img: /u/aguahara/resenas/rosa-nunez.jpg
    md: |
      Durante el tiempo q hice aguahara no hubo pasado, ni futuro. Tampoco pensamientos más allá de la respiración y la sensación corporal de fluir... No había luz, no había ruido, no había espacio ni tiempo. Únicamente la mágica sensación de sumergirse y emerger del agua. Al emerger el sol acariciaba la cara. Dentro del agua me deslizaba ingrávida en un espacio infinito, llena de paz. Una maravillosa experiencia sensorial. Gracias.
  - title: Norma
    img: /u/aguahara/resenas/norma.jpg
    md: |
      Uf! Qué difícil ponerle palabras a esto!!!

      2 cosas destacaría:
      1. Yo tuve la sensación de recuperar la conexión del fluir en el vientre materno.\
      De no tener que haber nada y disponer de todo lo que necesitaba. 
      2. También sentí expansión, la sensación de ser más allá de mi piel, de los límites corporales y el conectar con ese vacío lleno donde todo está bien, el gozo de la vida, de sentirte en casa y reconocer de dónde venimos.

      Gracias de nuevo Marta.
  - title: Borja
    img: /u/aguahara/resenas/borja.jpg
    md: |
      Muy seguro y relajado, dejando todo mi cuerpo a su merced. 

      Me sentí como un niño, sin preocupaciones y bien cuidado!!

      El rato que duro, desconecte del mundo exterior, solo sentía el contacto de su cuerpo y sus manos con el mío!!

      Al acabar la sesión me sentí muy relajado, era como si mi cuerpo no quisiera salir del agua, todo era placer.
  - title: Valerie
    img: /u/aguahara/resenas/valerie-sm.jpg
    md: |
      ![1/1](/u/aguahara/resenas/valerie.mp4)
  - title: Nicolay Vysotskyy
    img: /u/aguahara/resenas/nicolay-vysotskyy.jpg
    md: |
      Si t’hagués de dir les 5 experiències de la meva vida aquesta en seria sense dubte

      Expansió, harmonia, bellesa, connexió amb un mateix i amb el tot a la vegada

      L’aguahara es essència, connexió de la llibertat del ser amb la Pau interior, expansió de la consciència cap a la teva naturalesa. Sanació.
  - title: Albert
    img: /u/aguahara/resenas/albert.jpg
    md: |
      Aguahara para mí fue como sumergirme en recuerdos de la infancia. Una liberación del cuerpo envuelto en agua. Abrir los ojos y dejarme llevar por un recorrido desconocido hasta llegar a la paz mental.
  - title: Irene
    img: /u/aguahara/resenas/irene.jpg
    md: |
      El aguahara con Marta me hizo conectar con mi infancia, con mi calma e incluso con mi yo dentro del vientre materno. Una experiencia única. Marta tiene una delicadeza y un respeto hacia lo que va ocurriendo en cada momento. Sin duda, un regalo para los sentidos.
  - title: Montse Mas Dausà
    img: /u/aguahara/resenas/montse-mas-dausa.jpg
    md: |
      El aquahara es una experiencia magnifica y maravillosa que no te debes perder sensación de libertad de no pensar en nada y solo de disfrute la conexión con el agua te transporta a otro lugar y lo más importante nuestra terapeuta Marta que es maravillosa con esa energía que desprende a raudales te hace sentir única. Gracias por esta experiencia 😘😘
  - title: Nina
    img: /u/aguahara/resenas/nina.jpg
    md: |
      El placer de experimentar Aguahara en el embarazo,  meditación ingrávida que eleva el alma y conecta tu ser a un estado de profunda felicidad y conciencia.

      Danza acuática que te mimetiza con el elemento. Conexión emocional uterina y en mi caso plenitud con mis dos bebés. Sentirlos fluir, danzando y llenos de puro amor, es una experiencia única, reveladora y un viaje a tu interior sin precedentes.
  - title: Alejandra
    img: /u/aguahara/resenas/alejandra.jpg
    md: |
      Describiría Aguahara como una experiencia única e irrepetible. Realizada con una profesional que te hace sentir segura, protegida y cuidada en todo momento.

      Para mí represento un encuentro con tu animal acuático, un recuerdo del vientre materno, un viaje a lo divino.

      Sin dudarlo, repetiría.
  - title: Sonia
    img: /u/aguahara/resenas/sonia.jpg
    md: |
      Sentí como si estuviera haciendo una meditación con un relax total, pero en el agua, había momentos que no sentías que estabas en el agua, sino que flotabas, sentir la ingravidez, era muy relajante y muy placentero. Definitivamente algo que hay que experminetar.
  - title: María Esther
    md: |
      Mi experiencia con Aguahara ha sido fantástica, sentirme acunada por Marta en el agua hizo despertar memorias celulares del tiempo uterino. Me relajé profundamente, me encantó el masaje q me hizo en el agua. Y en la experiencia de inmersión se abría un túnel de luz por el que sentía ganas de entregarme y rendirme. Marta acompaña y sostiene con tanto amor que permitió que me entregara en total confianza al descanso y relax profundo.

      Un disfrute en todos los sentidos. Lo recomiendo totalmente.
  - title: Valerie
    md: |
      Para mí ha sido un viaje muy lejos y muy intenso a la vez que una relajación y paz absoluta
